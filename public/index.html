<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد ربات واتساپ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #075e54 0%, #128c7e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 1200px;
            margin: 20px;
            padding: 20px;
            width: 100%;
        }
        
        /* صفحه اتصال */
        .connect-page {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
        }
        .connect-page h1 {
            color: #075e54;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .connect-page .subtitle {
            color: #6c757d;
            margin-bottom: 30px;
        }
        .whatsapp-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .btn {
            background: #25d366;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 18px;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.3s;
            width: 100%;
            margin: 10px 0;
        }
        .btn:hover {
            background: #1eb955;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3);
        }
        .btn-secondary {
            background: #075e54;
        }
        .btn-secondary:hover {
            background: #064a42;
        }
        .qr-container {
            margin: 20px 0;
            text-align: center;
        }
        .qr-container img {
            max-width: 280px;
            border: 3px solid #25d366;
            border-radius: 15px;
            padding: 15px;
            background: white;
        }
        .pairing-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #ddd;
        }
        .pairing-section h3 {
            color: #075e54;
            margin-bottom: 15px;
        }
        .pairing-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            text-align: center;
            margin-bottom: 10px;
            transition: border-color 0.3s;
        }
        .pairing-input:focus {
            border-color: #25d366;
            outline: none;
        }
        
        /* داشبورد */
        .dashboard {
            display: none;
        }
        .header {
            background: white;
            color: #075e54;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .header h1 { font-size: 24px; }
        .status-badge {
            background: #ff0000;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
        }
        .status-badge.connected { background: #25d366; }
        .status-badge.waiting_qr { background: #ffa500; }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .card h2 { color: #075e54; margin-bottom: 15px; font-size: 18px; }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
        }
        textarea { height: 80px; resize: vertical; }
        .messages-log {
            max-height: 400px;
            overflow-y: auto;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 10px;
        }
        .message-item {
            background: white;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 10px;
            border-right: 3px solid #25d366;
        }
        .message-item .sender {
            font-weight: bold;
            color: #075e54;
            font-size: 14px;
        }
        .message-item .time {
            font-size: 12px;
            color: #6c757d;
            float: left;
        }
        .message-item .text { margin-top: 5px; font-size: 14px; }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-danger:hover { background: #c82333; }
        .btn-sm {
            padding: 10px 20px;
            font-size: 14px;
            width: auto;
        }
        
        @media (max-width: 768px) {
            .main-content { grid-template-columns: 1fr; }
            .connect-page { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- صفحه اتصال -->
        <div class="connect-page" id="connectPage">
            <div class="whatsapp-icon">💬</div>
            <h1>اتصال به واتساپ</h1>
            <p class="subtitle">ربات واتساپ خود را متصل کنید</p>
            
            <div id="statusText" style="margin: 20px 0; font-size: 16px; color: #075e54;">
                در حال بررسی وضعیت...
            </div>
            
            <div class="qr-container" id="qrContainer" style="display: none;">
                <p style="margin-bottom: 15px; color: #075e54; font-weight: bold;">
                    📱 QR Code را با واتساپ اسکن کنید
                </p>
            </div>
            
            <button class="btn" id="connectBtn" onclick="connect()">
                🔌 اتصال با QR Code
            </button>
            
            <div class="pairing-section">
                <h3>📱 یا اتصال با شماره موبایل</h3>
                <input type="tel" class="pairing-input" id="phoneNumber" 
                       placeholder="مثلاً: 98912xxxxxxx" dir="ltr">
                <button class="btn btn-secondary" onclick="connectWithPhone()">
                    📲 دریافت کد اتصال
                </button>
                <div id="pairingCode" style="margin-top: 15px; display: none;">
                    <p style="font-weight: bold; color: #075e54;">کد اتصال شما:</p>
                    <h2 id="pairingCodeText" style="color: #25d366; font-size: 32px; letter-spacing: 5px;"></h2>
                    <p style="color: #6c757d; font-size: 14px; margin-top: 10px;">
                        این کد را در واتساپ وارد کنید
                    </p>
                </div>
            </div>
        </div>
        
        <!-- داشبورد -->
        <div class="dashboard" id="dashboard">
            <div class="header">
                <h1>🤖 داشبورد ربات واتساپ</h1>
                <div class="status-badge" id="statusBadge">غیرفعال</div>
            </div>
            
            <div class="main-content">
                <div class="card">
                    <h2>📤 ارسال پیام</h2>
                    <input type="text" id="number" placeholder="شماره مقصد (مثلاً: 98912xxxxxxx)" dir="ltr">
                    <textarea id="message" placeholder="متن پیام..."></textarea>
                    <button class="btn btn-sm" onclick="sendMessage()">📨 ارسال</button>
                </div>
                
                <div class="card">
                    <h2>📋 پیام‌های دریافتی</h2>
                    <div class="messages-log" id="messagesLog">
                        <p style="color: #6c757d;">پیامی دریافت نشده است</p>
                    </div>
                </div>
                
                <div class="card" style="grid-column: 1 / -1; text-align: center;">
                    <button class="btn btn-danger btn-sm" onclick="disconnect()">❌ قطع اتصال</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        // چک کردن وضعیت فعلی
        fetch('/status')
            .then(r => r.json())
            .then(data => {
                if (data.status === 'connected') {
                    showDashboard();
                } else if (data.status === 'waiting_qr' && data.qr) {
                    showQR(data.qr);
                }
            });
        
        socket.on('qr', (data) => {
            showQR(data.qr);
        });
        
        socket.on('status', (data) => {
            if (data.status === 'connected') {
                showDashboard();
            }
        });
        
        socket.on('pairing-code', (data) => {
            document.getElementById('pairingCode').style.display = 'block';
            document.getElementById('pairingCodeText').textContent = data.code;
        });
        
        socket.on('incoming-message', (data) => {
            const messagesLog = document.getElementById('messagesLog');
            
            if (messagesLog.querySelector('p[style]')) {
                messagesLog.innerHTML = '';
            }
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message-item';
            messageDiv.innerHTML = `
                <div class="sender">👤 ${data.from}</div>
                <div class="time">${data.timestamp}</div>
                <div class="text">${data.message}</div>
            `;
            
            messagesLog.appendChild(messageDiv);
            messagesLog.scrollTop = messagesLog.scrollHeight;
        });
        
        function showQR(qr) {
            document.getElementById('connectPage').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('statusText').textContent = '📱 آماده اتصال';
            document.getElementById('qrContainer').style.display = 'block';
            document.getElementById('qrContainer').innerHTML = 
                `<p style="margin-bottom: 15px; color: #075e54; font-weight: bold;">
                    📱 QR Code را با واتساپ اسکن کنید
                </p>
                <img src="${qr}" alt="QR Code">`;
        }
        
        function showDashboard() {
            document.getElementById('connectPage').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('statusBadge').textContent = 'متصل';
            document.getElementById('statusBadge').className = 'status-badge connected';
        }
        
        function connect() {
            document.getElementById('statusText').textContent = 'در حال اتصال...';
            fetch('/connect', { method: 'POST' })
                .then(response => response.json())
                .then(data => console.log(data));
        }
        
        function connectWithPhone() {
            const phone = document.getElementById('phoneNumber').value;
            
            if (!phone) {
                alert('شماره موبایل را وارد کنید');
                return;
            }
            
            fetch('/connect-phone', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('statusText').textContent = 'در انتظار تأیید...';
                } else {
                    alert('خطا: ' + data.message);
                }
            });
        }
        
        function disconnect() {
            fetch('/disconnect', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    location.reload();
                });
        }
        
        function sendMessage() {
            const number = document.getElementById('number').value;
            const message = document.getElementById('message').value;
            
            if (!number || !message) {
                alert('شماره و متن پیام را وارد کنید');
                return;
            }
            
            fetch('/send-message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ number, message })
            })
            .then(response => response.json())
            .then(data => {
                alert(data.success ? '✅ پیام ارسال شد' : '❌ خطا: ' + data.message);
                if (data.success) {
                    document.getElementById('message').value = '';
                }
            });
        }
    </script>
</body>
                </html>
