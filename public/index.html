<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ربات واتساپ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #075e54 0%, #0a6e62 40%, #128c7e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .connect-card {
            background: white;
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.35);
            max-width: 440px;
            width: 100%;
            text-align: center;
        }
        .whatsapp-icon {
            font-size: 72px;
            margin-bottom: 10px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .connect-card h1 {
            color: #075e54;
            margin-bottom: 6px;
            font-size: 26px;
        }
        .connect-card .subtitle {
            color: #888;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .status-text {
            margin: 15px 0;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
        }
        .status-text.connected { background: #e8f9ef; color: #075e54; }
        .status-text.waiting_qr { background: #fff3e0; color: #e65100; }
        .status-text.disconnected { background: #fde8e8; color: #c62828; }
        .btn {
            background: #25d366;
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.3s;
            width: 100%;
            margin: 8px 0;
        }
        .btn:hover {
            background: #1eb955;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.35);
        }
        .btn:active { transform: translateY(0); }
        .btn-secondary {
            background: #075e54;
        }
        .btn-secondary:hover {
            background: #064a42;
            box-shadow: 0 8px 20px rgba(7, 94, 84, 0.35);
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: #ccc;
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }
        .divider span { padding: 0 12px; }
        .qr-container {
            margin: 15px 0;
            display: none;
        }
        .qr-container img {
            max-width: 260px;
            border: 3px solid #25d366;
            border-radius: 16px;
            padding: 12px;
            background: white;
        }
        .phone-row {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
            direction: ltr;
        }
        .phone-row select {
            width: 125px;
            flex-shrink: 0;
            padding: 14px 8px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            cursor: pointer;
            background: white;
            color: #333;
            transition: border-color 0.3s;
        }
        .phone-row select:focus {
            border-color: #25d366;
            outline: none;
        }
        .phone-row input {
            flex: 1;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            text-align: center;
            transition: border-color 0.3s;
            letter-spacing: 1px;
        }
        .phone-row input:focus {
            border-color: #25d366;
            outline: none;
        }
        .hint {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
            margin-bottom: 12px;
        }
        .pairing-result {
            margin-top: 18px;
            padding: 22px;
            background: linear-gradient(135deg, #f0f9f4 0%, #e8f5e9 100%);
            border-radius: 16px;
            display: none;
            animation: slideIn 0.4s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .pairing-result.show { display: block; }
        .pairing-result .label {
            font-weight: bold;
            color: #075e54;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .pairing-result .code {
            color: #25d366;
            font-size: 38px;
            letter-spacing: 8px;
            font-weight: bold;
            font-family: monospace;
            margin: 10px 0;
            text-shadow: 0 2px 4px rgba(37, 211, 102, 0.2);
        }
        .pairing-result .help {
            color: #888;
            font-size: 12px;
            margin-top: 10px;
            line-height: 1.6;
        }
        .loading {
            color: #25d366;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }
        .loading.show { display: block; }
        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }
    </style>
</head>
<body>
    <div class="connect-card">
        <div class="whatsapp-icon">💬</div>
        <h1>اتصال به واتساپ</h1>
        <p class="subtitle">ربات واتساپ خود را متصل کنید</p>
        
        <div id="statusText" class="status-text disconnected">در حال بررسی وضعیت...</div>
        
        <div class="qr-container" id="qrContainer">
            <p style="margin-bottom: 12px; color: #075e54; font-weight: bold; font-size: 14px;">
                📱 QR را با واتساپ اسکن کنید
            </p>
            <img id="qrImage" src="">
        </div>
        
        <button class="btn" onclick="connect()">🔌 اتصال با QR Code</button>
        
        <div class="divider"><span>یا</span></div>
        
        <h3 style="color: #075e54; font-size: 15px; margin-bottom: 12px;">📱 اتصال با شماره موبایل</h3>
        
        <div class="phone-row">
            <select id="countryCode">
                <option value="93" selected>🇦🇫 +93</option>
                <option value="98">🇮🇷 +98</option>
                <option value="1">🇺🇸 +1</option>
                <option value="44">🇬🇧 +44</option>
                <option value="49">🇩🇪 +49</option>
                <option value="971">🇦🇪 +971</option>
                <option value="966">🇸🇦 +966</option>
                <option value="90">🇹🇷 +90</option>
                <option value="7">🇷🇺 +7</option>
                <option value="92">🇵🇰 +92</option>
                <option value="880">🇧🇩 +880</option>
                <option value="91">🇮🇳 +91</option>
            </select>
            <input type="tel" id="phoneNumber" placeholder="7×××××××" dir="ltr" inputmode="numeric" maxlength="15">
        </div>
        <p class="hint">شماره بدون کد کشور وارد شود</p>
        
        <button class="btn btn-secondary" onclick="connectWithPhone()">📲 دریافت کد اتصال</button>
        
        <div class="loading" id="loadingText">در حال دریافت کد</div>
        
        <div class="pairing-result" id="pairingResult">
            <div class="label">کد اتصال شما:</div>
            <div class="code" id="pairingCodeText"></div>
            <div class="help">
                در واتساپ: Settings > Linked Devices > Link with phone number > کد را وارد کنید
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        document.getElementById('phoneNumber').addEventListener('input', e => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });
        
        fetch('/status')
            .then(r => r.json())
            .then(data => {
                updateStatus(data.status, data.qr);
            });
        
        function updateStatus(status, qr) {
            const el = document.getElementById('statusText');
            const labels = {
                connected: '✅ متصل',
                waiting_qr: '⏳ منتظر QR',
                disconnected: '❌ غیرفعال',
                connecting: '🔄 در حال اتصال...'
            };
            el.textContent = labels[status] || status;
            el.className = 'status-text ' + status;
            
            if (status === 'waiting_qr' && qr) {
                showQR(qr);
            }
        }
        
        socket.on('qr', data => showQR(data.qr));
        socket.on('status', data => updateStatus(data.status));
        
        socket.on('pairing-code', data => {
            document.getElementById('loadingText').classList.remove('show');
            document.getElementById('pairingResult').classList.add('show');
            document.getElementById('pairingCodeText').textContent = data.code;
        });
        
        function showQR(qrData) {
            const c = document.getElementById('qrContainer');
            c.style.display = 'block';
            document.getElementById('qrImage').src = qrData;
        }
        
        async function connect() {
            await fetch('/connect', { method: 'POST' });
        }
        
        async function connectWithPhone() {
            const cc = document.getElementById('countryCode').value;
            const num = document.getElementById('phoneNumber').value.trim().replace(/[^0-9]/g, '');
            if (!num) {
                alert('شماره را وارد کنید');
                return;
            }
            const fullPhone = cc + num;
            document.getElementById('pairingResult').classList.remove('show');
            document.getElementById('loadingText').classList.add('show');
            
            const res = await fetch('/connect-phone', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: fullPhone })
            });
            const data = await res.json();
            
            if (!data.success) {
                document.getElementById('loadingText').classList.remove('show');
                alert(data.message || 'خطا');
            }
        }
    </script>
</body>
</html>
